<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminAI - AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --success: #22c55e;
            --border: #27272a;
            --user-msg-bg: #6366f1;
            --ai-msg-bg: #1a1a24;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .api-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--error);
        }
        
        .status-dot.connected {
            background: var(--success);
        }
        
        /* Settings Panel */
        .settings-panel {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: none;
        }
        
        .settings-panel.active {
            display: block;
        }
        
        .settings-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .settings-row:last-child {
            margin-bottom: 0;
        }
        
        .settings-row label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            min-width: 80px;
        }
        
        .settings-row input {
            flex: 1;
            max-width: 400px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 0.875rem;
        }
        
        .settings-row input:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--accent-light);
        }
        
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        /* Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            overflow: hidden;
        }
        
        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar {
            background: var(--accent);
        }
        
        .message.assistant .message-avatar {
            background: var(--bg-card);
            border: 1px solid var(--border);
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9375rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .message.user .message-content {
            background: var(--user-msg-bg);
            border-bottom-right-radius: 4px;
        }
        
        .message.assistant .message-content {
            background: var(--ai-msg-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        
        .message-content code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.875em;
        }
        
        .message-content pre {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        
        .message-content pre code {
            background: none;
            padding: 0;
        }
        
        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        /* Input Area */
        .input-area {
            padding: 16px 0 24px;
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .input-container {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        
        .input-container:focus-within {
            border-color: var(--accent);
        }
        
        #messageInput {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 20px;
            color: var(--text-primary);
            font-size: 0.9375rem;
            font-family: inherit;
            resize: none;
            min-height: 48px;
            max-height: 150px;
            line-height: 1.5;
        }
        
        #messageInput:focus {
            outline: none;
        }
        
        #messageInput::placeholder {
            color: var(--text-secondary);
        }
        
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .send-btn:hover {
            background: var(--accent-light);
            transform: scale(1.05);
        }
        
        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }
        
        /* Welcome Message */
        .welcome {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }
        
        .welcome h2 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .welcome p {
            font-size: 0.9375rem;
            margin-bottom: 24px;
        }
        
        /* Error message */
        .error-msg {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            display: none;
        }
        
        .error-msg.visible {
            display: block;
        }
        
        /* Footer */
        footer {
            text-align: center;
            padding: 12px;
            color: var(--text-secondary);
            font-size: 0.75rem;
            border-top: 1px solid var(--border);
        }
        
        footer a {
            color: var(--accent);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🔮 LuminAI</div>
        <div class="api-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Not Connected</span>
            <button class="btn btn-secondary" id="settingsBtn" style="margin-left: 12px; padding: 6px 12px; font-size: 0.75rem;">Settings</button>
        </div>
    </header>
    
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-row">
            <label for="apiKey">API Key:</label>
            <input type="password" id="apiKey" placeholder="Enter your Perplexity API key">
            <button class="btn btn-primary" id="saveKeyBtn">Save</button>
            <button class="btn btn-secondary" id="clearKeyBtn">Clear</button>
        </div>
        <div class="error-msg" id="apiError"></div>
    </div>
    
    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="welcome">
                <h2>Welcome to LuminAI Chat</h2>
                <p>Ask me anything! Configure your Perplexity API key in Settings to get started.</p>
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <div class="input-container">
                    <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                </div>
                <button class="send-btn" id="sendBtn">↑</button>
            </div>
        </div>
    </div>
    
    <footer>
        Powered by <a href="https://app.all-hands.dev">OpenHands</a> | <a href="https://github.com/antono4/luminai">View on GitHub</a>
    </footer>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const apiKeyInput = document.getElementById('apiKey');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const clearKeyBtn = document.getElementById('clearKeyBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const apiError = document.getElementById('apiError');
        
        let apiKey = localStorage.getItem('perplexity_api_key') || '';
        let isTyping = false;
        
        // Initialize
        if (apiKey) {
            apiKeyInput.value = '••••••••••••••••';
            updateConnectionStatus(true);
        }
        
        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
        });
        
        // Send message on Enter (Shift+Enter for new line)
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        sendBtn.addEventListener('click', sendMessage);
        
        // Settings panel toggle
        settingsBtn.addEventListener('click', () => {
            settingsPanel.classList.toggle('active');
        });
        
        // Save API key
        saveKeyBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key || key === '••••••••••••••••') {
                showError('Please enter a valid API key');
                return;
            }
            
            // Test the API key
            try {
                const response = await fetch('https://api.perplexity.ai.chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'sonar',
                        messages: [{ role: 'user', content: 'Hi' }],
                        max_tokens: 10
                    })
                });
                
                if (!response.ok && response.status !== 200) {
                    throw new Error('Invalid API key');
                }
                
                apiKey = key;
                localStorage.setItem('perplexity_api_key', key);
                apiKeyInput.value = '••••••••••••••••';
                updateConnectionStatus(true);
                hideError();
                settingsPanel.classList.remove('active');
            } catch (err) {
                showError('Invalid API key. Please check and try again.');
            }
        });
        
        // Clear API key
        clearKeyBtn.addEventListener('click', () => {
            apiKey = '';
            localStorage.removeItem('perplexity_api_key');
            apiKeyInput.value = '';
            updateConnectionStatus(false);
            hideError();
        });
        
        function updateConnectionStatus(connected) {
            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Not Connected';
            }
        }
        
        function showError(msg) {
            apiError.textContent = msg;
            apiError.classList.add('visible');
        }
        
        function hideError() {
            apiError.classList.remove('visible');
        }
        
        function addMessage(content, isUser = false) {
            const message = document.createElement('div');
            message.className = `message ${isUser ? 'user' : 'assistant'}`;
            
            const avatar = isUser ? '👤' : '🔮';
            
            message.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${formatContent(content)}</div>
            `;
            
            // Remove welcome message if exists
            const welcome = messagesContainer.querySelector('.welcome');
            if (welcome) welcome.remove();
            
            messagesContainer.appendChild(message);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function addTypingIndicator() {
            const message = document.createElement('div');
            message.className = 'message assistant';
            message.id = 'typingIndicator';
            message.innerHTML = `
                <div class="message-avatar">🔮</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(message);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }
        
        function formatContent(content) {
            // Escape HTML
            let formatted = content
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            
            // Format code blocks
            formatted = formatted.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            
            // Format inline code
            formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            return formatted;
        }
        
        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || isTyping) return;
            
            if (!apiKey) {
                addMessage('Please set your Perplexity API key in Settings first.', false);
                return;
            }
            
            // Add user message
            addMessage(content, true);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            
            // Show typing indicator
            isTyping = true;
            sendBtn.disabled = true;
            addTypingIndicator();
            
            try {
                const response = await fetch('https://api.perplexity.ai.chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'sonar',
                        messages: [{ role: 'user', content: content }],
                        max_tokens: 2000
                    })
                });
                
                removeTypingIndicator();
                
                if (!response.ok) {
                    const error = await response.json().catch(() => ({}));
                    throw new Error(error.error?.message || 'Failed to get response');
                }
                
                const data = await response.json();
                const aiContent = data.choices?.[0]?.message?.content || 'No response received.';
                addMessage(aiContent, false);
                
            } catch (err) {
                removeTypingIndicator();
                addMessage(`Error: ${err.message}`, false);
            } finally {
                isTyping = false;
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
