<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuminAI Self-Healing Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e4;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #0f3460;
        }
        
        h1 {
            font-size: 2rem;
            color: #00d9ff;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .status-running {
            background: #00d9ff;
            color: #1a1a2e;
        }
        
        .status-stopped {
            background: #ff6b6b;
            color: #fff;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .status-running {
            animation: pulse 2s infinite;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #00d9ff;
        }
        
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .stat-item {
            background: rgba(0, 217, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00d9ff;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }
        
        .schedule-info {
            text-align: center;
            padding: 20px;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .schedule-info .time {
            font-size: 3rem;
            font-weight: bold;
            color: #00d9ff;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            border-radius: 4px;
            transition: width 1s ease;
        }
        
        .logs {
            background: #0d1117;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
        }
        
        .log-entry {
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 4px;
            border-left: 3px solid;
        }
        
        .log-info { background: rgba(0, 217, 255, 0.1); border-color: #00d9ff; }
        .log-success { background: rgba(0, 255, 136, 0.1); border-color: #00ff88; }
        .log-error { background: rgba(255, 107, 107, 0.1); border-color: #ff6b6b; }
        
        .timestamp {
            color: #666;
            margin-right: 10px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn-primary {
            background: #00d9ff;
            color: #1a1a2e;
        }
        
        .btn-primary:hover {
            background: #00ff88;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #ff6b6b;
            color: #fff;
        }
        
        .btn-danger:hover {
            background: #ff4757;
        }
        
        .config-section {
            background: #0d1117;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 LuminAI Self-Healing Agent</h1>
            <span id="statusBadge" class="status-badge status-stopped">Stopped</span>
        </header>
        
        <!-- Schedule Info -->
        <div class="schedule-info">
            <div class="label">Next Run In</div>
            <div class="time" id="countdown">10:00</div>
            <div class="label">minutes</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar" style="width: 0%"></div>
            </div>
        </div>
        
        <div class="grid">
            <!-- Statistics -->
            <div class="card">
                <h2>📈 Statistics</h2>
                <div class="stat-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="bugsDetected">0</div>
                        <div class="stat-label">Bugs Detected</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="bugsFixed">0</div>
                        <div class="stat-label">Bugs Fixed</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="successRate">0%</div>
                        <div class="stat-label">Success Rate</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalRuns">0</div>
                        <div class="stat-label">Total Runs</div>
                    </div>
                </div>
            </div>
            
            <!-- Configuration -->
            <div class="card">
                <h2>⚙️ Configuration (c4.yml)</h2>
                <div class="config-section" id="configDisplay">
                    Loading c4.yml configuration...
                </div>
                <div class="controls">
                    <button class="btn-primary" onclick="loadConfig()">🔄 Reload</button>
                </div>
            </div>
            
            <!-- Controls -->
            <div class="card">
                <h2>🎮 Controls</h2>
                <div class="controls">
                    <button class="btn-primary" id="startBtn" onclick="startScheduler()">
                        ▶️ Start Scheduler
                    </button>
                    <button class="btn-danger" id="stopBtn" onclick="stopScheduler()" disabled>
                        ⏹️ Stop
                    </button>
                </div>
                <div style="margin-top: 15px;">
                    <label style="color: #888;">Interval (minutes):</label>
                    <input type="number" id="intervalInput" value="10" min="1" max="60" 
                           style="width: 80px; padding: 8px; border-radius: 4px; border: 1px solid #333; 
                                  background: #0d1117; color: #e4e4e4; margin-left: 10px;">
                    <button class="btn-primary" onclick="updateInterval()" style="padding: 8px 16px;">
                        Update
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Logs -->
        <div class="card">
            <h2>📋 Activity Logs</h2>
            <div class="logs" id="logContainer">
                <div class="log-entry log-info">
                    <span class="timestamp">[--:--:--]</span>
                    System initialized. Click "Start Scheduler" to begin.
                </div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let intervalMinutes = 10;
        let countdownSeconds = intervalMinutes * 60;
        let countdownInterval = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            addLog('info', 'Dashboard loaded successfully');
        });
        
        async function loadConfig() {
            try {
                const response = await fetch('c4.yml');
                if (response.ok) {
                    const text = await response.text();
                    document.getElementById('configDisplay').textContent = text.substring(0, 1000) + '...';
                    addLog('success', 'Configuration loaded from c4.yml');
                } else {
                    document.getElementById('configDisplay').textContent = 'Using default configuration';
                    addLog('warning', 'c4.yml not found, using defaults');
                }
            } catch (error) {
                document.getElementById('configDisplay').textContent = 'Error loading config';
                addLog('error', 'Failed to load c4.yml');
            }
        }
        
        function addLog(type, message) {
            const container = document.getElementById('logContainer');
            const now = new Date();
            const timestamp = now.toLocaleTimeString();
            
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
            
            container.insertBefore(logEntry, container.firstChild);
            
            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }
        
        function updateCountdown() {
            const minutes = Math.floor(countdownSeconds / 60);
            const seconds = countdownSeconds % 60;
            document.getElementById('countdown').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            const progress = ((intervalMinutes * 60 - countdownSeconds) / (intervalMinutes * 60)) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            
            countdownSeconds--;
            
            if (countdownSeconds < 0) {
                countdownSeconds = intervalMinutes * 60;
                runWorkflow();
            }
        }
        
        function runWorkflow() {
            addLog('info', '🔄 Running self-healing workflow...');
            
            // Simulate workflow
            setTimeout(() => {
                const bugsDetected = Math.floor(Math.random() * 3);
                const bugsFixed = Math.floor(Math.random() * (bugsDetected + 1));
                
                document.getElementById('bugsDetected').textContent = 
                    parseInt(document.getElementById('bugsDetected').textContent) + bugsDetected;
                document.getElementById('bugsFixed').textContent = 
                    parseInt(document.getElementById('bugsFixed').textContent) + bugsFixed;
                document.getElementById('totalRuns').textContent = 
                    parseInt(document.getElementById('totalRuns').textContent) + 1;
                
                const total = parseInt(document.getElementById('bugsDetected').textContent);
                const fixed = parseInt(document.getElementById('bugsFixed').textContent);
                const rate = total > 0 ? Math.round((fixed / total) * 100) : 0;
                document.getElementById('successRate').textContent = rate + '%';
                
                addLog('success', `✅ Workflow completed: ${bugsFixed}/${bugsDetected} bugs fixed`);
            }, 2000);
        }
        
        function startScheduler() {
            if (isRunning) return;
            
            isRunning = true;
            countdownSeconds = intervalMinutes * 60;
            
            document.getElementById('statusBadge').textContent = 'Running';
            document.getElementById('statusBadge').className = 'status-badge status-running';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            
            countdownInterval = setInterval(updateCountdown, 1000);
            runWorkflow();
            
            addLog('info', `Scheduler started - running every ${intervalMinutes} minutes`);
        }
        
        function stopScheduler() {
            if (!isRunning) return;
            
            isRunning = false;
            
            document.getElementById('statusBadge').textContent = 'Stopped';
            document.getElementById('statusBadge').className = 'status-badge status-stopped';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            clearInterval(countdownInterval);
            
            addLog('info', 'Scheduler stopped');
        }
        
        function updateInterval() {
            const newInterval = parseInt(document.getElementById('intervalInput').value);
            
            if (newInterval >= 1 && newInterval <= 60) {
                intervalMinutes = newInterval;
                countdownSeconds = intervalMinutes * 60;
                addLog('info', `Interval updated to ${intervalMinutes} minutes`);
            } else {
                addLog('error', 'Invalid interval (1-60 minutes)');
            }
        }
    </script>
</body>
</html>
