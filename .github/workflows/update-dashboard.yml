name: 📊 Update Dashboard

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    name: 📈 Update Dashboard
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            github-income-strategies
            .github/income-progress
          sparse-checkout-cone-mode: false
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 📊 Update Dashboard
        run: |
          python << 'EOF'
          import os
          import json
          import datetime
          from pathlib import Path
          
          # Load progress
          progress_dir = Path(".github/income-progress")
          progress_file = progress_dir / "progress.json"
          
          if progress_file.exists():
              with open(progress_file) as f:
                  progress = json.load(f)
          else:
              progress = {
                  "last_run": datetime.datetime.now().isoformat(),
                  "run_count": 1,
                  "total_earnings": 0
              }
          
          # Load tasks
          tasks_file = progress_dir / "tasks.json"
          if tasks_file.exists():
              with open(tasks_file) as f:
                  tasks = json.load(f)
          else:
              tasks = {}
          
          # Calculate completion
          completed = 0
          total = 0
          for method in tasks.values():
              for task in method:
                  total += 1
                  if task['status'] == 'completed':
                      completed += 1
          
          completion_pct = int((completed / total * 100)) if total > 0 else 0
          
          # Generate dashboard
          dashboard = f"""# 💰 GitHub Income Strategies Dashboard

![Workflow](https://img.shields.io/badge/Workflow-Runs%20Every%2030%20Min-blue)
![Last Run](https://img.shields.io/badge/Last%20Run-{progress['last_run'][:10]}-green)
![Progress](https://img.shields.io/badge/Progress-{completion_pct}%-yellow)
![Earnings](https://img.shields.io/badge/Total%20Earnings-${progress['total_earnings']}-green)

## 📈 Overview

| Metric | Value |
|--------|-------|
| Total Runs | {progress['run_count']} |
| Tasks Completed | {completed}/{total} |
| Completion Rate | {completion_pct}% |
| Total Earnings | ${progress['total_earnings']} |

## 🎯 Methods Status

| Method | Completed | Status |
|--------|-----------|--------|
"""
          
          method_names = {
              "github_sponsors": "💝 GitHub Sponsors",
              "marketplace": "🏪 Marketplace",
              "open_source_business": "🏢 Open Source Business",
              "popular_projects": "⭐ Popular Projects",
              "github_actions": "⚙️ GitHub Actions",
              "bug_bounty": "🐛 Bug Bounty"
          }
          
          method_status = {
              "github_sponsors": "not_started",
              "marketplace": "not_started",
              "open_source_business": "not_started",
              "popular_projects": "not_started",
              "github_actions": "not_started",
              "bug_bounty": "not_started"
          }
          
          for method, name in method_names.items():
              method_completed = sum(1 for t in tasks.get(method, []) if t['status'] == 'completed')
              method_total = len(tasks.get(method, []))
              status = "✅ Active" if method_completed > 0 else "🔴 Not Started"
              dashboard += f"| {name} | {method_completed}/{method_total} | {status} |\n"
          
          dashboard += f"""
## 📋 Quick Actions

1. [View Progress Report](./github-income-strategies/PROGRESS.md)
2. [View Task List](./github-income-strategies/TASKS.md)
3. [GitHub Sponsors](./github-income-strategies/1-github-sponsors.md)
4. [Marketplace](./github-income-strategies/2-marketplace.md)
5. [Open Source Business](./github-income-strategies/3-open-source-business.md)
6. [Popular Projects](./github-income-strategies/4-popular-projects.md)
7. [GitHub Actions](./github-income-strategies/5-github-actions.md)
8. [Bug Bounty](./github-income-strategies/6-bug-bounty.md)

## 🔄 Next Run

Next automation run: in 30 minutes

## 📊 Last Updated

{datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')}

---
*Dashboard auto-generated by GitHub Actions*
"""
          
          # Save dashboard
          dashboard_file = Path("github-income-strategies/DASHBOARD.md")
          with open(dashboard_file, "w") as f:
              f.write(dashboard)
          
          print(f"Dashboard updated! Progress: {completion_pct}%")
          EOF
          
      - name: 🚀 Commit Dashboard
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add -A
          git diff --staged --quiet || git commit -m "📊 Auto-update: Dashboard [skip ci]"
          git push origin feature/github-income-strategies || echo "No changes to push"
